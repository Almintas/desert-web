name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Buildui jokių paslapčių nereikia: web instrumentation.ts env netikrina build metu, admin
# API_URL turi numatytą reikšmę, o SELLER patikra (next.config.ts) veikia tik su
# VERCEL_ENV=production, kurio čia nenustatom.

jobs:
  ci:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm versija paimama iš package.json → packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # mongod, kurį API testams atsisiunčia mongodb-memory-server (versija: apps/api/test/global-setup.ts).
      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/api/test/global-setup.ts') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      # Turbo vietinė talpykla (be Vercel remote cache): nepakitę paketai neperkompiliuojami.
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
